<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost signal — Abhishek Babu Shetty</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307090b'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23c8f542' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23c8f542'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07090b; --ink: #eef1ee; --ink-2: #a4aaa6; --ink-3: #7b827e; --acc: #c8f542; --acc-ink: #0b0c05; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Geist, system-ui, sans-serif; display: grid; place-items: center; padding: 16px; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  main { position: relative; text-align: center; max-width: 640px; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
  .mono b { color: var(--acc); font-weight: 400; }
  h1 { font-size: clamp(5rem, 22vw, 13rem); font-weight: 300; letter-spacing: -0.07em; line-height: 0.85; margin: 18px 0 10px; }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--acc); font-weight: 400; }
  p { color: var(--ink-2); font-size: 1.1rem; line-height: 1.55; margin-bottom: 32px; }
  a.btn { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px; border-radius: 999px; background: var(--acc); color: var(--acc-ink); text-decoration: none; font-weight: 500; transition: transform 0.4s cubic-bezier(.16,1,.3,1); }
  a.btn:hover { transform: translateY(-3px); }
  a.btn:focus-visible { outline: 2px solid var(--acc); outline-offset: 4px; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <div class="mono"><b>●</b> error · route not found in memory</div>
  <h1>4<em>0</em>4</h1>
  <p>Even the best agents lose the signal sometimes. This page doesn't exist — but everything I've built does.</p>
  <a class="btn" href="/portfolio/">Back to the portfolio →</a>
</main>
<script>
  // drifting particles that scatter from the cursor
  const c = document.getElementById('c'), x = c.getContext('2d');
  let W, H, pts = [], m = { x: -999, y: -999 };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    pts = Array.from({ length: Math.round(W * H / 5000) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, a: Math.random() < .2 }));
  }
  size(); addEventListener('resize', size);
  addEventListener('pointermove', (e) => { m.x = e.clientX; m.y = e.clientY; });
  (function f() {
    requestAnimationFrame(f);
    x.clearRect(0, 0, W, H);
    for (const p of pts) {
      const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
      if (d < 120) { p.vx += dx / d * .3; p.vy += dy / d * .3; }
      p.vx *= .96; p.vy *= .96;
      if (!reduced) { p.x += p.vx + .05; p.y += p.vy; }
      if (p.x > W) p.x = 0; if (p.x < 0) p.x = W; if (p.y > H) p.y = 0; if (p.y < 0) p.y = H;
      x.fillStyle = p.a ? 'rgba(200,245,66,.8)' : 'rgba(238,241,238,.35)';
      x.fillRect(p.x, p.y, 1.6, 1.6);
    }
  })();
</script>
</body>
</html>
